name: m3_workflow
run-name: milestone-3

on:
  workflow_dispatch:

# TODO: add a concurrency: block here (group + cancel-in-progress: true), then push
# twice quickly and watch the second run cancel the first instead of queuing behind it.
# concurrency:
#   group: ???
#   cancel-in-progress: true

jobs:
  # --- Matrix: two axes, then include/exclude ---
  # All jobs below run on Kylo (the only runner we've got), so this matrix varies
  # values, not OS — the concept's the same either way.
  matrix_job:
    runs-on: [self-hosted]
    strategy:
      fail-fast: true # TODO: flip to false once you've seen the default behavior, compare
      matrix:
        version: [18, 20, 22]
        config: [debug, release]
        # TODO: add an `include:` entry that creates a combination NOT already covered
        # by the cross product above (e.g. version: 16, config: legacy) — prove include
        # can ADD a combo, not just annotate an existing one.
        # TODO: add an `exclude:` entry that removes one of the 6 combinations above.
        # Predict the resulting job count before you run this.
    steps:
      - name: show-combo
        run: echo "version=${{ matrix.version }} config=${{ matrix.config }}"
      # TODO: add a step that fails for exactly one combination, e.g.
      #   if: matrix.version == 18
      #   run: exit 1
      # — that's what makes fail-fast actually do something observable.

  # --- needs diamond: two parallel jobs feeding one join job ---
  diamond_a:
    runs-on: [self-hosted]
    needs: matrix_job
    steps:
      - run: echo "diamond_a"

  diamond_b:
    runs-on: [self-hosted]
    needs: matrix_job
    steps:
      - run: echo "diamond_b"
      # TODO: make this step fail on purpose (temporarily) to test the gates below,
      # then put it back.

  diamond_join:
    runs-on: [self-hosted]
    needs: [diamond_a, diamond_b]
    # TODO: try `if: always()` here first, run it, then switch to `if: failure()` and
    # run it again — note which combinations of diamond_a/diamond_b success/failure
    # actually let this job execute under each.
    steps:
      - name: report
        run: |
          echo "diamond_a result: ${{ needs.diamond_a.result }}"
          echo "diamond_b result: ${{ needs.diamond_b.result }}"
          # TODO: also echo needs.matrix_job.result here. matrix_job had 6 (or however
          # many after include/exclude) legs — what does a single .result value report
          # for a job that was actually a matrix?

  # --- Service container, addressed two different ways ---
  service_localhost:
    runs-on: [self-hosted]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: connect-via-localhost
        run: |
          # TODO: this job runs directly on Kylo (no container:), so the service's
          # port mapping is reachable at localhost:5432. Prove it — psql, nc, curl,
          # whatever's on hand.
          echo "placeholder"

  # TODO: copy service_localhost above, rename the job, add `container: <some image>`
  # to the job itself, and change the connection step to address the service by its
  # label (postgres:5432) instead of localhost — no ports: mapping needed once both
  # the job and the service share Docker's user-defined network.
