name: m3_workflow
run-name: milestone-3
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # --- Matrix: two axes, then include/exclude ---
  # Runs on Kylo, so this matrix varies values, not OS — the concept's the same
  # either way. (The service-container jobs further down use ubuntu-latest instead —
  # see the comment there.)
  matrix_job:
    runs-on: [self-hosted]
    strategy:
      fail-fast: true
      matrix:
        version: [18, 22]
        config: [debug, release]
        include:
          - version: 16
            config: legacy
        exclude:
          - version: 22
            config: debug
    steps:
      - name: show-combo
        run: echo "version=${{ matrix.version }} config=${{ matrix.config }}"
  # --- needs diamond: two parallel jobs feeding one join job ---
  diamond_a:
    runs-on: [self-hosted]
    needs: matrix_job
    steps:
      - run: echo "diamond_a"
  diamond_b:
    runs-on: [self-hosted]
    needs: matrix_job
    steps:
      - run: echo "diamond_b"
  diamond_join:
    runs-on: [self-hosted]
    needs: [diamond_a, diamond_b]
    steps:
      - name: report
        run: |
          echo "diamond_a result: ${{ needs.diamond_a.result }}"
          echo "diamond_b result: ${{ needs.diamond_b.result }}"
          echo "matrix_job result: ${{ needs.matrix_job }}"

          # TODO: also echo needs.matrix_job.result here. matrix_job had 6 (or however
          # many after include/exclude) legs — what does a single .result value report
          # for a job that was actually a matrix?
  # --- Service container, addressed two different ways ---
  # services:/container: require a LINUX runner — self-hosted runners on macOS or
  # Windows can't run either, full stop, regardless of whether Docker is installed.
  # Kylo's on macOS, so these two jobs use GitHub-hosted ubuntu-latest instead —
  # free and unlimited on a public repo, and it's the exact same services:/container:
  # syntax the exam tests either way.
  service_localhost:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: connect-via-localhost
        run: |
          # TODO: this job runs directly on the runner (no container:), so the
          # service's port mapping is reachable at localhost:5432. Prove it —
          # psql, nc, curl, whatever's on hand.
          echo "placeholder"
          ss -tulpn

