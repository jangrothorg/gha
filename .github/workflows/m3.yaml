name: m3_workflow
run-name: milestone-3
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # --- Matrix: two axes, then include/exclude ---
  # Runs on Kylo, so this matrix varies values, not OS — the concept's the same
  # either way. (The service-container jobs further down use ubuntu-latest instead —
  # see the comment there.)
  matrix_job:
    runs-on: [self-hosted]
    strategy:
      fail-fast: true
      matrix:
        version: [18, 22]
        config: [debug, release]
        include:
          - version: 16
            config: legacy
        exclude:
          - version: 22
            config: debug
    steps:
      - name: show-combo
        run: echo "version=${{ matrix.version }} config=${{ matrix.config }}"
  # --- needs diamond: two parallel jobs feeding one join job ---
  diamond_a:
    runs-on: [self-hosted]
    needs: matrix_job
    steps:
      - run: echo "diamond_a"
  diamond_b:
    runs-on: [self-hosted]
    needs: matrix_job
    steps:
      - run: echo "diamond_b"
  diamond_join:
    runs-on: [self-hosted]
    needs: [diamond_a, diamond_b, matrix_job]
    steps:
      - name: report
        run: |
          echo "diamond_a result: ${{ needs.diamond_a.result }}"
          echo "diamond_b result: ${{ needs.diamond_b.result }}"
          echo "matrix_job result: ${{ needs.matrix_job.result }}"
          # Confirmed: a single aggregated string (success/failure/...), not one per leg —
          # and it only showed up once matrix_job was added to THIS job's own needs: list.
          # needs is non-transitive: diamond_a/diamond_b needing matrix_job didn't make it
          # visible here until diamond_join named it directly too.
  # --- Service container, addressed two different ways ---
  # services:/container: require a LINUX runner — self-hosted runners on macOS or
  # Windows can't run either, full stop, regardless of whether Docker is installed.
  # Kylo's on macOS, so these two jobs use GitHub-hosted ubuntu-latest instead —
  # free and unlimited on a public repo, and it's the exact same services:/container:
  # syntax the exam tests either way.
  service_localhost:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: connect-via-localhost
        env:
          PGPASSWORD: postgres
        run: |
          # No container: on this job, so the service's `ports:` mapping is what makes
          # it reachable at all — address it via localhost, same as any other port
          # forwarded from the runner's host network.
          sudo apt-get install -y postgresql-client >/dev/null
          psql -h localhost -U postgres -c 'select 1;'
  # Job itself now runs inside a container (postgres:16, same image, so psql is
  # already on hand) — that puts both the job and the service on the same Docker
  # user-defined network, so no ports: mapping is needed, and the service is reached
  # by its label (postgres) as a hostname instead of localhost.
  service_in_container:
    runs-on: ubuntu-latest
    container: postgres:16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: connect-via-label
        env:
          PGPASSWORD: postgres
        run: psql -h postgres -U postgres -c 'select 1;'
