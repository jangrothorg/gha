name: m4_workflow
run-name: milestone-4
on:
  workflow_dispatch:
jobs:
  anchors_mine:
    runs-on: [self-hosted]
    env: &env_vars
      NODE_ENV: production
      DATABASE_URL: www.ccc.de
    steps:
      - run: 'echo "TODO: build your own anchor/alias example here, whole-value only"'
  job_one:
    runs-on: [self-hosted]
    env: &shared_env
      GREETING: hello
      MODE: production
    steps:
      - run: 'echo "job_one sees MODE=$MODE GREETING=$GREETING"'
  job_two:
    runs-on: [self-hosted]
    env: *shared_env
    steps:
      - run: 'echo "job_two sees MODE=$MODE GREETING=$GREETING"'
  # --- Reusable workflow, called two ways ---
  # One-time setup so there's something real to pass/inherit below:
  #   gh secret set DEMO_SECRET --body "whatever" --repo jangrothorg/gha
  # m4_reusable.yaml tolerates a missing secret too, so both calls still run either way.
  call_explicit:
    uses: ./.github/workflows/m4_reusable.yaml
    with:
      greeting: "called with an explicit secrets: mapping"
    secrets:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
  call_inherit:
    uses: ./.github/workflows/m4_reusable.yaml
    with:
      greeting: "called with secrets: inherit"
    secrets: inherit
